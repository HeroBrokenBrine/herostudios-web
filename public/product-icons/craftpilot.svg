<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D084"/>
      <stop offset="100%" stop-color="#009B5C"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark circle background -->
  <circle cx="256" cy="256" r="250" fill="#1a1a2e"/>
  <circle cx="256" cy="256" r="240" fill="none" stroke="#00D084" stroke-width="3" opacity="0.15"/>

  <!-- Pickaxe icon forming "C" -->
  <g transform="translate(256,256) scale(2.8)" filter="url(#glow)">
    <!-- Pickaxe head -->
    <path d="M 0 -30 L 15 -15 L 8 -8 L -8 -22 Z"
          fill="url(#emeraldGrad)" stroke="#00D084" stroke-width="1"/>
    <path d="M -8 -22 L -20 -35 L -16 -40 L -4 -27 Z"
          fill="url(#emeraldGrad)" stroke="#00D084" stroke-width="1"/>
    <path d="M 8 -8 L 20 -20 L 16 -25 L 4 -12 Z"
          fill="url(#emeraldGrad)" stroke="#00D084" stroke-width="1"/>

    <!-- Handle as "C" -->
    <path d="M -5 -5 Q -35 5 -40 25 Q -45 45 -30 55"
          fill="none" stroke="#00D084" stroke-width="4" stroke-linecap="round"/>
    <path d="M -5 -5 Q 10 5 14 18 Q 18 32 10 42"
          fill="none" stroke="#00D084" stroke-width="4" stroke-linecap="round"/>

    <!-- Circuit nodes -->
    <circle cx="-25" cy="15" r="2.5" fill="#00D084" opacity="0.5"/>
    <circle cx="-38" cy="35" r="2" fill="#00D084" opacity="0.4"/>
    <circle cx="-22" cy="50" r="2.5" fill="#00D084" opacity="0.3"/>
    <line x1="-25" y1="15" x2="-38" y2="35" stroke="#00D084" stroke-width="0.8" opacity="0.3"/>
    <line x1="-38" y1="35" x2="-22" y2="50" stroke="#00D084" stroke-width="0.8" opacity="0.3"/>
  </g>
</svg>
