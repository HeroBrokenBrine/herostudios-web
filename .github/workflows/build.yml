name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: node node_modules/astro/astro.js build

      - name: Verify build output
        run: node -e "const fs=require('fs');for(const f of ['dist/index.html','dist/sitemap.xml','dist/robots.txt','dist/site.webmanifest','dist/products/index.html','dist/docs/index.html','dist/downloads/index.html']){if(!fs.existsSync(f)){console.error('Missing '+f);process.exit(1)}}const n=(fs.readdirSync('dist',{recursive:true}).filter(x=>x.endsWith('.html'))).length;console.log('Pages built: '+n);if(n<50)process.exit(1)"

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/
